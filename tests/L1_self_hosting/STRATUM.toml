name = "Self Hosting"
order = 1
description = "Rack runs a small Rack suite and writes results"
enabled = true
concerns = ["self_hosting"]

objectives = [
    "Rack can run a minimal suite from an explicit RACK_TESTS_DIR",
    "Rack writes summary and HTML report artifacts",
]

[dependencies]
strata = ["L0_public_cli"]

[[subtests]]
id = "L1_001"
file = "test_L1_001_run_fixture_suite.py"
name = "Run Fixture Suite"
description = "Run a package-local fixture suite through the Rack CLI"
concerns = ["self_hosting"]
test_case_type = "synthetic"
test_cases = "../fixtures/simple_suite"

[subtests.code_under_test]
module = "rack.cli"

[[subtests]]
id = "L1_002"
file = "test_L1_002_declarations.py"
name = "Self-Declared Test Declarations"
description = "Read and validate RACK declarations, entry points, statuses, deferrals, and JSON vector files statically"
concerns = ["self_hosting", "declarations"]
test_case_type = "synthetic"

[[subtests.code_under_test]]
module = "rack.declarations"
functions = ["read_declaration", "declaration_problems", "load_vector_file", "validate_deferrals", "is_self_declared", "decode_value"]

[[subtests.code_under_test]]
module = "rack.code_refs"
functions = ["check_code_ref", "declaration_code_problems", "project_root"]

[[subtests]]
id = "L1_003"
file = "test_L1_003_outcomes.py"
name = "Outcomes And Exact Comparison"
description = "Typed differences with stable paths, exact deferral matching, canonical digests, and report serialization"
concerns = ["self_hosting", "outcomes"]
test_case_type = "synthetic"

[subtests.code_under_test]
module = "rack.outcomes"
functions = ["compare_exact", "classify", "canonical_digest", "difference_to_dict"]

[[subtests]]
id = "L1_004"
file = "test_L1_004_plugin.py"
name = "Self-Declared Test Plugin"
description = "Expand self-declared files into case-by-implementation rows with lanes, selection, deferrals, checks, authority loaders, and budgets"
concerns = ["self_hosting", "declarations", "outcomes"]
test_case_type = "synthetic"
test_cases = "../fixtures/declared_suite"

[subtests.code_under_test]
module = "rack.plugin"
classes = ["RackFile", "RackItem", "RackCase", "Suite"]

[[subtests]]
id = "L1_005"
file = "test_L1_005_declared_cli.py"
name = "Self-Declared Files In Rack Commands"
description = "Audit rules for self-declared files and run --impl, list, refresh, report, inventory, status, and audit over a mixed suite"
concerns = ["self_hosting", "declarations", "cli"]
test_case_type = "synthetic"
test_cases = "../fixtures/declared_suite"

[[subtests.code_under_test]]
module = "rack.audit"

[[subtests.code_under_test]]
module = "rack.accounting"
functions = ["rack_row"]

[[subtests.code_under_test]]
module = "rack.declaration_tally"
functions = ["tally_declarations", "outside_strata", "require_declared"]

[[subtests.code_under_test]]
module = "rack.declarations"
functions = ["declared_test_files", "load_declaration", "manifest_entries", "manifest_entry"]

[[subtests]]
id = "L1_006"
file = "test_L1_006_parity.py"
name = "Parity Accounting"
description = "rack parity counts implementation statuses, case outcomes, and debt; the report renders the grid"
concerns = ["self_hosting", "parity"]
test_case_type = "synthetic"
test_cases = "../fixtures/declared_suite"

[[subtests.code_under_test]]
module = "rack.parity"
functions = ["build_parity", "collect_entries", "latest_rows", "format_parity_text"]

[[subtests.code_under_test]]
module = "rack.parity_html"
functions = ["render_parity_html"]

[[subtests.code_under_test]]
module = "rack.parity_cli"
functions = ["cmd_parity"]

[[subtests]]
id = "L1_007"
file = "test_L1_007_parallel.py"
name = "Parallel Runs"
description = "rack run --jobs uses pytest-xdist for opted-in strata, falls back to serial runs, and merges per-worker progress files"
concerns = ["self_hosting", "parallel"]
test_case_type = "synthetic"
test_cases = "../fixtures/declared_suite"

[[subtests.code_under_test]]
module = "rack.parallel"
functions = ["xdist_arguments"]

[[subtests.code_under_test]]
module = "rack.progress"
functions = ["worker_progress_file"]

[[subtests.code_under_test]]
module = "rack.progress_cli"
classes = ["ProgressTailer"]

[[subtests]]
id = "L1_008"
file = "test_L1_008_tracing.py"
name = "Operation Tracing"
description = "Trace self-declared tests through the operation registry to dispatch lines, handlers, and library code, and print the chain"
concerns = ["self_hosting", "declarations", "tracing"]
test_case_type = "synthetic"
test_cases = "../fixtures/declared_suite"

[[subtests.code_under_test]]
module = "rack.native_tests"
functions = ["cargo_command", "native_items"]

[[subtests.code_under_test]]
module = "rack.status_rows"
functions = ["declared_row", "skip_reason", "settle", "record"]

[[subtests.code_under_test]]
module = "rack.tracing"
functions = ["load_registry", "operations_constructed", "trace_declaration", "trace_problems", "declared_calls"]

[[subtests.code_under_test]]
module = "rack.trace_cli"
functions = ["cmd_trace", "format_trace", "trace_to_json"]

[[subtests.code_under_test]]
module = "rack.code_refs"
functions = ["locate_code_ref", "unreferenced_calls", "find_dispatch_line"]
